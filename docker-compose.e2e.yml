version: '3.8'
services:
  postgres-e2e:
    image: ankane/pgvector:latest
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=1GB"]
    environment:
      POSTGRES_DB: ibpms_e2e
      POSTGRES_USER: ibpms
      POSTGRES_PASSWORD: ibpms_e2e_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibpms -d ibpms_e2e"]
      interval: 5s
      retries: 5

  redis-e2e:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  camunda-e2e:
    image: camunda/camunda-bpm-platform:run-7.21.0
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/engine-rest/version || exit 1"]
      interval: 10s
      retries: 10

  rabbitmq-e2e:
    image: rabbitmq:3.12-management
    environment:
      HOME: /tmp
      RABBITMQ_ERLANG_COOKIE: "ibpms_e2e_cookie"
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_e2e_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5

  azurite-e2e:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"

volumes:
  rabbitmq_e2e_data:
