spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jersey.JerseyAutoConfiguration
      - org.camunda.bpm.spring.boot.starter.rest.CamundaBpmRestJerseyAutoConfiguration
  jersey:
    type: filter
    application-path: /engine-rest
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Disable context-path for integration tests (tests use full absolute paths)
server:
  servlet:
    context-path: ""

# Disable Camunda auto-deploy, job execution and external task client in tests
camunda:
  bpm:
    client:
      disable: true
    deployment-resource-pattern: ""
    job-execution:
      enabled: false
    database:
      schema-update: false

# Security: use a static JWT secret for tests
ibpms:
  pii:
    encryption:
      key: ibpms-test-aes256-encryption-k32
  clamav:
    url: http://localhost:3310
    timeout-ms: 5000
  webhook:
    security:
      mode: HMAC
      hmac-secret: test-hmac-secret-key-for-webhook-validation
    payload:
      max-size-bytes: 10485760
    pre-triage:
      process-definition-key: Process_PreTriaje_Intake
  azure:
    storage:
      connection-string: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
      container-name: ibpms-docs-test
  security:
    jwt:
      secret: UAT_SUPER_SECRET_KEY_THAT_IS_VERY_LONG_AND_SECURE_982374982374892374

# App-level properties for tests
app:
  storage:
    path: ./uploads-test
  azure:
    storage:
      connection-string: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
      container-name: ibpms-docs-test

jwt:
  secret: changeme-this-must-be-at-least-32-chars-for-hs256-signature!!
  expiration: 3600
