version: '3.8'
services:
  postgres-e2e:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: ibpms_e2e
      POSTGRES_USER: ibpms
      POSTGRES_PASSWORD: ibpms_e2e_pass
    ports:
      - "5433:5432"
    volumes:
      - ./backend/ibpms-core/src/main/resources/seed-e2e.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibpms -d ibpms_e2e"]
      interval: 5s
      retries: 5

  redis-e2e:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  camunda-e2e:
    image: camunda/camunda-bpm-platform:run-7.21.0
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/engine-rest/version || exit 1"]
      interval: 10s
      retries: 10

  rabbitmq-e2e:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5
