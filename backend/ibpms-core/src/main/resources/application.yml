spring:
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: ibpms-core
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ibpms_db}
    username: ${POSTGRES_USER:ibpms_user}
    password: ${POSTGRES_PASSWORD:ibpms_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update # Auto-reparación por Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    # HO-03: Defer datasource init para que seed-dev.sql se ejecute DESPUÉS de Liquibase + Hibernate DDL
    defer-datasource-initialization: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # HO-03: Auto-carga de datos mínimos para desarrollo local
  sql:
    init:
      mode: never
      data-locations: classpath:seed-dev.sql
      continue-on-error: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

camunda:
  bpm:
    # ADR-003: Camunda 7 corre EMPOTRADO en este proceso JVM.
    # El External Task Client es exclusivo para Camunda remoto (Camunda Run/Standalone).
    # Tenerlo activo en modo embedded genera un loop de 401 en /engine-rest/external-task/fetchAndLock.
    client:
      disable: true # DESHABILITADO — motor embedded, no se necesita cliente externo
      base-url: http://localhost:8080/engine-rest
      max-tasks: 1
      async-response-timeout: 10000
    database:
      type: postgres
    deployment-resource-pattern: classpath:/processes/*.bpmn
    job-execution:
      enabled: true
    history-level: full

app:
  storage:
    path: ./uploads
ibpms:
  pii:
    encryption:
      key: ${IBPMS_PII_ENCRYPTION_KEY:ibpms-dev-aes256-encryption-k32!}
  clamav:
    url: ${CLAMAV_URL:http://localhost:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:5000}
  webhook:
    security:
      mode: ${WEBHOOK_SECURITY_MODE:HMAC}
      hmac-secret: ${HMAC_SECRET:mock-secret-for-local}
    payload:
      max-size-bytes: ${WEBHOOK_MAX_PAYLOAD_BYTES:10485760}
    pre-triage:
      process-definition-key: ${WEBHOOK_PRE_TRIAGE_PROCESS_KEY:Process_PreTriaje_Intake}
  azure:
    storage:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
      container-name: ${AZURE_STORAGE_CONTAINER:ibpms-docs}

jwt:
  secret: ${JWT_SECRET:changeme-this-must-be-at-least-32-chars-for-hs256-signature!!}
  expiration: 900

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

resilience4j.circuitbreaker:
  instances:
    crmService:
      registerHealthIndicator: true
      slidingWindowSize: 10              # Evalúa fallos en las últimas 10 llamadas
      minimumNumberOfCalls: 5            # Espera 5 llamadas antes de calcular el ratio de error
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 15s       # En caso de falla, asume apertura de 15 segundos
      failureRateThreshold: 50           # Activa modo degradado si fallan el 50% de las llamadas

---
spring:
  config:
    activate:
      on-profile: e2e
  datasource:
    url: jdbc:postgresql://localhost:5433/ibpms_e2e
    username: ibpms
    password: ibpms_e2e_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 20000
  sql:
    init:
      mode: always
      data-locations: classpath:seed-e2e.sql
      continue-on-error: true

  liquibase:
    enabled: true
  jpa:
    defer-datasource-initialization: false
  data:
    redis:
      host: localhost
      port: 6380
  rabbitmq:
    host: localhost
    port: 5673

camunda:
  bpm:
    client:
      base-url: http://localhost:8080/api/v1/engine-rest

